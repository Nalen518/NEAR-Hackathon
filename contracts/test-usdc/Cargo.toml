[package]
name = "test-usdc"
description = "Test USDC for the sandbox and the testnet fallback: NEP-141 with storage registration and a faucet"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
